server:
  port: 8080

spring:
  application:
    name: event-driven-commerce-intelligence-platform

  datasource:
    url: jdbc:h2:mem:commercedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: "enterprise-super-secret-key-32-chars-minimum-infosys-2026-specialist"
    expiration-ms: 86400000
  catalog:
    fakestore-url: "https://fakestoreapi.com/products"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
